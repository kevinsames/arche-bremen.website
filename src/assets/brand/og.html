<!doctype html>
<!--
  Quelle für public/og.jpg (Open-Graph-Vorschaukarte, 1200×630, siehe
  BaseLayout.astro). Wird nicht ausgeliefert — src/assets ist kein
  Seitenordner. Export-Weg: README, Abschnitt „Markendateien".

  Bis September 2026 war die Quelle og.svg: nur Logo-Pfade auf gebrochenem
  Weiß, bewusst ohne Text, weil <text> in SVG an installierten Systemfonts
  hängt. Hier kommen die Schriften per @font-face aus public/fonts/ und die
  Werte aus tokens.css — dieselben Dateien wie auf der Website, nichts
  hängt am Rechner, auf dem gerendert wird.

  Aufbau wie der Kopf von /kontakt (PageHeader, cloud 2): Dunkles Blau,
  Farbwolke, darüber der Verlauf, der die Schrift schützt. Der Bogen wie im
  Hero der Startseite. Gelbe Schrift nur über --text-accent-on-dark und nur
  unten, wo der Verlauf am dunkelsten ist. Kontrast am hellsten
  Hintergrundpixel gemessen, siehe DESIGN.md, Abschnitt „Logo" — wer Wolke,
  Verlauf oder Textlage ändert, misst neu.
-->
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="../../styles/tokens.css" />
    <style>
      @font-face {
        font-family: 'Futura';
        src: url('../../../public/fonts/futura-700.woff2') format('woff2');
        font-weight: 700;
        font-style: normal;
      }

      @font-face {
        font-family: 'Source Serif Pro';
        src: url('../../../public/fonts/source-serif-400-v2.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
      }

      html,
      body {
        margin: 0;
      }

      /* Feste Kartengröße statt Viewport: Die Karte ist ein Bild, kein
         Layout. Der Export rendert mit exakt diesem Fenster. */
      .card {
        position: relative;
        isolation: isolate;
        overflow: clip;
        width: 1200px;
        height: 630px;
        box-sizing: border-box;
        padding: var(--sp-6);
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        background-color: var(--bg-inverted);
        color: var(--text-on-dark);
      }

      .cloud {
        position: absolute;
        inset: -26%;
        z-index: -2;
        background-image: var(--cloud-2);
      }

      .card::after {
        content: '';
        position: absolute;
        inset: 0;
        z-index: -1;
        background-image: var(--scrim-card);
      }

      .logo {
        display: block;
        width: var(--size-logo-hero);
        height: auto;
      }

      /* Pfad eingebettet statt wie im Hero als mask-image: bogen.svg: Chrome
         behandelt eine lokal geöffnete Datei als eigene Herkunft und
         blockiert Masken aus Nachbardateien (CORS). Pfaddaten unverändert
         aus bogen.svg — ändert sich dort etwas, hier nachziehen. */
      .mark {
        position: absolute;
        top: 4%;
        right: -3%;
        width: 24rem;
        height: auto;
        color: var(--accent-warm);
        opacity: 0.8;
      }

      h1 {
        margin: 0;
        font-family: var(--font-display);
        font-weight: 700;
        font-size: var(--fs-display);
        line-height: var(--lh-display);
        letter-spacing: var(--tracking-tight);
      }

      .accent {
        color: var(--text-accent-on-dark);
      }

      .lead {
        margin: var(--sp-4) 0 0;
        font-family: var(--font-body);
        font-size: var(--fs-xl);
        line-height: var(--lh-tight);
        letter-spacing: var(--tracking-body);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="cloud" aria-hidden="true"></span>
      <svg class="mark" viewBox="750 -8 174 124" aria-hidden="true">
        <path fill="currentColor" d="M911.25,0.417c-40,4.583 -63.333,23.75 -74.167,35.416c-10.833,-11.666 -34.166,-30.833 -74.166,-35.416l-4.584,-0.417l0,54.167l3.334,0.833c39.166,9.583 61.25,35.833 69.583,45.833c1.25,1.25 2.083,2.5 2.917,3.334l2.916,3.333l2.917,-3.333c0.833,-0.834 1.667,-1.667 2.5,-3.334c8.333,-10 30.833,-36.666 70,-45.833l3.333,-0.833l0,-54.167l-4.583,0.417Zm-68.75,41.666c9.167,-10 29.583,-27.5 65,-32.916l0,15c-26.667,4.583 -49.167,17.916 -69.583,39.583c-2.5,-2.5 -5,-5.417 -7.917,-7.917c3.333,-3.333 8.75,-9.583 12.5,-13.75Zm-10.833,0c-2.5,2.917 -5,5.834 -7.5,8.75c-13.75,-11.25 -32.5,-22.083 -57.5,-26.25l-0,-15c35,5 55.416,22.5 65,32.5Zm5.416,52.5c-9.166,-10.833 -31.666,-36.666 -70.416,-47.083l-0,-14.583c47.916,8.75 72.5,45.416 77.5,53.75c-2.917,3.333 -5.417,5.833 -7.084,7.916Zm13.334,-14.166c-1.667,-2.5 -3.75,-5.834 -6.667,-9.584c18.75,-20.416 39.583,-32.916 64.167,-37.5l-0,14.167c-26.667,7.083 -45.417,21.25 -57.5,32.917Z" />
      </svg>
      <img class="logo" src="arche-logo-white.svg" alt="" />
      <div>
        <h1>Sag einfach<br /><span class="accent">Moin.</span></h1>
        <p class="lead">Wir gründen eine Gemeinde in Bremen.</p>
      </div>
    </div>
  </body>
</html>
